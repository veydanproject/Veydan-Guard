# VGuard (Veydan Guard): the read policy of a Veydan relay, a WebSocket proxy
# between nginx and strfry. Its own workspace: a change of the policy is a
# release of the guard, and of nothing else.
#
# Built on one crate of services/common (Veydan-Common): veydan-denied, the
# keys and the groups the network denies, read here and by VPush and VCloud
# alike. That is the one path dependency that leaves this folder; a snapshot
# takes it from Veydan-Common by tag.
#
# The versions continue those of vguard inside Veydan-Push (0.4.0 – 0.5.1):
# a kit reads VGUARD_VERSION as one line of numbers.
[workspace]
resolver = "2"
members = ["crates/vguard"]

[workspace.package]
version = "0.7.0"
edition = "2021"
publish = false
authors = ["Veydan Project"]
# PolyForm Perimeter 1.0.1, as the whole project: LICENSE is a copy of the
# monorepo's, here because this folder becomes the root of a repository.
license-file = "LICENSE"

[workspace.dependencies]
veydan-denied = { git = "https://github.com/veydanproject/Veydan-Common", tag = "v0.1.0" }

anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util", "fs"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "registry", "fmt", "ansi"] }
url = "2"
ring = "0.17"
nostr = { version = "0.45", default-features = false, features = ["std", "os-rng"] }
# The API of nostr-sdk changes with every release: the version is pinned
# (the tests run a relay of its own, `local-relay`).
nostr-sdk = { version = "=0.45.6", default-features = false, features = ["ring", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# The WebSocket both ways: the version nostr-sdk brings already.
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }
# The HTTP API of the access modes (spec/vguard.md, "The access API"): bound
# only when a server is not open; the same axum as VRegistry.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
